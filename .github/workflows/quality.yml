name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate deployment configuration
        run: npm run test:deploy-config
      - name: Build production package
        run: npm run build

  backend:
    name: PHP lint and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite, sodium
          coverage: none
      - name: Lint PHP files
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run smoke tests
        run: |
          for test in api/tests/*_smoke.php; do
            php "$test"
          done
